name: Build and validate
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            cc: gcc
            cxx: g++
          - os: ubuntu-24.04
            cc: clang
            cxx: clang++
          - os: macos-15
            cc: clang
            cxx: clang++
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6 ninja==1.11.1.3
      - run: cmake --preset debug && cmake --build --preset debug --parallel 2 && ctest --preset debug
      - run: cmake --preset release && cmake --build --preset release --parallel 2 && ctest --preset release
      - run: cmake --build --preset release --target package
      - run: python scripts/package_smoke.py build/release/packages/*.tar.gz
      - run: python scripts/demo.py
      - run: cmake --install build/release --prefix "$RUNNER_TEMP/failurelab-install"
  sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6 ninja==1.11.1.3
      - run: cmake --preset sanitize && cmake --build --preset sanitize --parallel 2 && ctest --preset sanitize
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install cmake==3.31.6 ninja==1.11.1.3 clang-format==18.1.8 clang-tidy==18.1.8
      - run: python scripts/format.py
      - run: cmake --preset tidy && cmake --build --preset tidy --parallel 2
